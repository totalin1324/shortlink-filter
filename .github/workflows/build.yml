name: Build filter

on:
  push:
    branches: [main]
    paths:
      - shortlink_filter.txt
      - excluded.txt
      - scripts/build.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 정리 및 버전 갱신
        run: python3 scripts/build.py shortlink_filter.txt

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortlink_filter.txt
          git commit -m "chore: 버전 자동 갱신"
          git push
